name: Windows portable EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install hash-locked Windows wheels
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-windows-build.lock
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Build self-contained EXE
        run: python build_portable.py --output portable-dist
      - name: Run the actual EXE from two moved paths
        run: python verify_portable.py portable-dist/PDFWorkspace.exe portable-dist/reports
      - name: Upload tested portable program
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PDFWorkspace-Windows-x64-portable
          path: portable-dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics if validation failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-build-diagnostics
          path: |
            portable-dist/*.txt
            portable-dist/*.json
            portable-dist/reports/
          if-no-files-found: ignore
          retention-days: 7
